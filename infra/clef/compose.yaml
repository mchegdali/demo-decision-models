name: test-typesafe-ai

# Docker users only: wslc has no compose support, see bench/containers.ps1 for the wslc commands.
# First fill the weights volume:
#   docker compose -f infra/clef/compose.yaml run --rm --user 0 clef python -m clef_fetch meossistant/clef-flash-4bit
services:
  clef:
    build:
      context: .
      args:
        TORCH_INDEX: cu128
    image: test-typesafe-ai/clef:cu128
    pull_policy: build
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      CLEF_MODEL: ${CLEF_MODEL:-meossistant/clef-flash-4bit}
      CLEF_MODEL_NAME: ${CLEF_MODEL_NAME:-clef-flash}
      CLEF_DEVICE: cuda
      CLEF_API_KEY: ${CLEF_API_KEY:-}
    volumes:
      - clef-weights:/models/hf
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clef-weights:
